# ===========================================================================
# Yem's — Cloudflare Workers + Pages
#
# Le Worker sert les routes /api/* ; les pages générées par tools/build.py
# sont servies en statique par le même déploiement (assets).
# ===========================================================================

name = "yems"
main = "worker.js"

# ─── Domaine ───────────────────────────────────────────────────────────────
#
# maisonyems.com est acheté. Ces deux lignes restent commentées jusqu'à ce que
# le domaine apparaisse en « Active » dans Cloudflare, c'est-à-dire jusqu'à ce
# que les serveurs de noms aient été changés chez le registrar.
#
# Les décommenter trop tôt fait échouer le déploiement ENTIER, exactement comme
# la liaison R2 plus bas : le site en ligne ne serait pas mis à jour non plus.
#
# Marche à suivre complète : docs/mise-en-ligne-cloudflare.md, « Le nom de
# domaine : maisonyems.com ».
#
# routes = [
#   { pattern = "maisonyems.com", custom_domain = true },
#   { pattern = "www.maisonyems.com", custom_domain = true }
# ]

# 2025-09-01 ou plus récent : c'est à partir de cette date que node:fs est
# disponible sous nodejs_compat. Nous ne nous en servons pas — le catalogue
# est importé — mais le driver postgres réclame des primitives Node.
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ─── Pages statiques ───────────────────────────────────────────────────────
# run_worker_first envoie /api/* au Worker AVANT toute recherche de fichier.
# Sans lui, not_found_handling intercepte les routes d'API et renvoie la page
# 404 en HTML au lieu du JSON attendu.
#
# La forme tableau demande Wrangler 4. Si une erreur signale que la valeur
# doit être booléenne, c'est que Wrangler 3 est installé :
#   npm install wrangler@4 --save-dev
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# not_found_handling est volontairement absent : il court-circuitait le Worker
# et renvoyait 404.html sur les routes /api/*. La page 404 est désormais servie
# par worker.js, qui garde ainsi la main sur tout ce qui n'est pas un fichier.

# ─── Base de données ───────────────────────────────────────────────────────
# Hyperdrive maintient le pool de connexions côté Cloudflare et rapproche les
# connexions de la base. Créer la liaison puis reporter l'id :
#   npx wrangler hyperdrive create yems-db --connection-string="postgres://…"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3579ef8baef64ecdb4c59c6a97379e71"

# ─── Photos déposées par l'atelier ─────────────────────────────────────────
#
# DÉSACTIVÉ tant que R2 n'est pas activé sur le compte. Une liaison qui pointe
# vers un bucket inexistant fait échouer le déploiement entier : le reste du
# site ne partirait pas non plus.
#
# Pour l'activer, dans l'ordre :
#   1. dash.cloudflare.com -> R2 Object Storage -> Enable
#      (Cloudflare demande une carte même pour le palier gratuit : 10 Go
#      offerts, aucun frais de sortie, rien n'est prélevé en dessous)
#   2. npx wrangler r2 bucket create yems-photos
#   3. retirer les # des trois lignes ci-dessous
#   4. npm run deploy
#
# Sans cette liaison, tout fonctionne sauf le dépôt de photos depuis l'écran
# d'administration, qui affiche un message explicite plutôt que de planter.
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "yems-photos"

# ─── Variables non sensibles ───────────────────────────────────────────────
[vars]
# "offline" : commande + WhatsApp, règlement convenu de vive voix.
# "online"  : ajoute le widget de paiement. Exige un compte marchand activé.
PAYMENT_MODE = "offline"
KKIAPAY_SANDBOX = "true"
OWNER_WHATSAPP = "2290191380234"

# Adresse qui reçoit l'alerte de commande. Elle DOIT être vérifiée dans
# Cloudflare (Email > Email Routing > Destination addresses) : c'est cette
# vérification qui rend l'envoi gratuit sur le plan Free.
# À remplir avec ton adresse, puis redéployer.
# OWNER_EMAIL = "…@gmail.com"
ORDER_EMAIL_FROM = "commandes@maisonyems.com"

# ─── Envoi d'e-mail ────────────────────────────────────────────────────────
#
# Cloudflare Email Sending, beta publique depuis avril 2026. Le binding donne
# à worker.js la méthode env.EMAIL.send().
#
# DÉSACTIVÉ jusqu'à ce que maisonyems.com soit actif dans Cloudflare : comme
# pour les routes et pour R2, un binding qui référence un domaine inconnu fait
# échouer le déploiement entier.
#
# Ordre des opérations :
#   1. le domaine passe « Active » (serveurs de noms changés chez le registrar)
#   2. Cloudflare > Email > Email Routing > Destination addresses :
#      ajouter ton adresse et cliquer le lien de confirmation reçu
#   3. renseigner OWNER_EMAIL ci-dessus
#   4. décommenter les trois lignes ci-dessous
#   5. npm run deploy
#
# allowed_sender_addresses verrouille l'expéditeur : même si le code était un
# jour modifié pour écrire depuis une autre adresse, Cloudflare refuserait.
# C'est une ceinture peu coûteuse contre l'usurpation du domaine.
#
# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["commandes@maisonyems.com"]
#
# Sans ce binding, tout fonctionne : la commande s'enregistre, WhatsApp part si
# configuré, et courriel.js sort proprement en indiquant « binding EMAIL absent ».

# ─── Secrets — NE JAMAIS les écrire ici ────────────────────────────────────
# Ils se posent en ligne de commande, ils sont alors chiffrés côté Cloudflare :
#
#   npx wrangler secret put KKIAPAY_PUBLIC_KEY
#   npx wrangler secret put KKIAPAY_PRIVATE_KEY
#   npx wrangler secret put KKIAPAY_SECRET_KEY
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put WHATSAPP_TOKEN      # facultatif
#   npx wrangler secret put WHATSAPP_PHONE_ID   # facultatif

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1
