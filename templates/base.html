<!-- Les polices ne bloquent plus l'affichage. « media=print » fait charger la
     feuille sans qu'elle retarde le rendu ; onload la réactive dès qu'elle est
     là. Le texte s'affiche donc immédiatement en Georgia et en police système,
     puis bascule sur Fraunces et Inter. Sur une 3G, ça évite plusieurs
     centaines de millisecondes de page blanche.

     Le <noscript> garde le comportement classique pour qui n'exécute pas de
     script : mieux vaut attendre les polices que ne jamais les recevoir.

     Poids demandé aussi allégé : la graisse 300 d'Inter n'était utilisée
     nulle part dans les feuilles de style. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap">
<noscript>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap">
</noscript>

{{extra_css}}

<!-- Favicone : mêmes proportions que le monogramme de svg-defs.html, mais la
     hampe reste pleine. À 16 px dans un onglet, un pointillé de 3 px disparaît
     ou se transforme en bouillie de pixels. Le fond espresso est conservé :
     sans lui, un trait laiton sur l'onglet clair d'un navigateur serait
     illisible. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314100D'/%3E%3Cpath d='M5.6 7.4L16 18.6 26.4 7.4M16 19.2v5.6' stroke='%23D9B87A' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- Rideau d'ouverture. Trois règles ont guidé sa construction :

     1. Il ne peut pas rester bloqué. La disparition est une animation CSS
        avec « forwards » : elle se produit même si le JavaScript ne se
        charge jamais. Le script ne fait que l'accélérer.
     2. Il n'ajoute aucune requête. Style et logique sont écrits ici, dans le
        document, et pèsent moins d'un kilo-octet.
     3. Il ne se montre qu'une fois. Sans ça, chaque clic dans le menu
        rejouerait le rideau, ce qui est vite insupportable.

     Il est enfin désactivé pour qui a demandé moins d'animations. -->
<style>
.curtain { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
  background: #14100D; animation: curtain-lift 700ms cubic-bezier(.16,1,.3,1) 1550ms forwards; }
.curtain svg { width: 82px; height: 82px; color: #D9B87A; }
/* Le V se dessine, puis la couture apparaît. La hampe garde son propre
   pointillé : lui appliquer un stroke-dasharray de tracé l'aurait effacé. */
.curtain path:first-child { stroke-dasharray: 60; stroke-dashoffset: 60;
  animation: curtain-stitch 1050ms cubic-bezier(.16,1,.3,1) forwards; }
.curtain path:last-child { opacity: 0;
  animation: curtain-thread 380ms ease-out 880ms forwards; }
@keyframes curtain-stitch { to { stroke-dashoffset: 0 } }
@keyframes curtain-thread { to { opacity: 1 } }
@keyframes curtain-lift { to { opacity: 0; visibility: hidden; pointer-events: none } }
/* Page prête plus tôt : on raccourcit, mais jamais en dessous du temps qu'il
   faut au monogramme pour finir de se coudre. Un rideau qui se lève sur un
   dessin inachevé ressemble à un bug, pas à une intention. */
.is-ready .curtain { animation-delay: 1260ms; animation-duration: 620ms; }
.curtain-off .curtain, .no-js-never .curtain { display: none; }
@media (prefers-reduced-motion: reduce) { .curtain { display: none } }
</style>
<script>
(function () {
  // Le rideau n'a de sens qu'à la toute première page ouverte. Ensuite, la
  // navigation interne doit être immédiate.
  try {
    if (sessionStorage.getItem('yems.entered')) {
      document.documentElement.className += ' curtain-off';
    } else {
      sessionStorage.setItem('yems.entered', '1');
    }
  } catch (e) { /* navigation privée : le rideau se montrera, sans conséquence */ }
})();
</script>
{{structured_data}}</head>

<div class="curtain" aria-hidden="true">
